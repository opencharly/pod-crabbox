# pod-crabbox — the Crabbox coordinator (Node.js/PostgreSQL runtime) as a service candy
#
# One candy: `crabbox-coordinator` builds the Crabbox Node coordinator from the
# pinned upstream tag and runs it supervised, backed by the opencharly postgresql
# candy (PostgreSQL 13+, pg-boss). Root-entity repo (pod-openclaw shape).
version: 2026.240.1943
crabbox-coordinator:
    candy:
        version: 2026.247.0100
        description: |
            The Crabbox Node.js/PostgreSQL coordinator (https://github.com/openclaw/crabbox,
            https://github.com/openclaw/crabbox/tree/main/worker/node) as a supervised
            service. Clones the pinned upstream tag, builds the Node runtime in-image
            (npm ci --include=dev + build:node + prune — the same recipe as the upstream
            worker/Dockerfile.node incl. the noVNC vendor step; the devDeps are needed
            AT BUILD (esbuild), so ci forces them in despite the candy's
            NODE_ENV=production runtime env; runtime stays slim via npm prune --omit=dev), and runs
            `node dist-node/server.mjs` under supervisord at priority 20 (after the
            postgresql service's 10), listening on port 8080 with /v1/health and
            /v1/ready container probes. The runtime start wrapper assembles
            DATABASE_URL from deploy-provided POSTGRES_* env (supervisord cannot
            expand variables), creating the crabbox/crabbox_jobs schemas on startup.
            Auth is deploy-time: shared-token (CRABBOX_SHARED_TOKEN + _OWNER) or
            GitHub OAuth — the candy ships none by default. This is the LOCAL,
            single-replica deployment (upstream flags the Node runtime as newly
            shipped; exact-tag pin + in-beds proof, no production-cloud cutover
            claims). The observable, verifiable effect — the built runtime at a
            fixed path, the supervised service, and live /v1/health + /v1/ready
            200s backed by a real PostgreSQL — is exactly what the plan block
            asserts.
        var:
            CRABBOX_COORDINATOR_TAG: v0.49.0
        require:
            - '@github.com/opencharly/layer-nodejs:v2026.239.1624'
            - '@github.com/opencharly/layer-supervisord:v2026.240.0121'
<<<<<<< HEAD
            - '@github.com/opencharly/pod-postgresql:v2026.247.1304'
=======
            - '@github.com/opencharly/pod-postgresql:v2026.239.1627'
>>>>>>> origin/main
            - '@github.com/opencharly/layer-gh:v2026.239.1624'
        env:
            NODE_ENV: "production"
        port:
            - 8080
        service:
            - name: crabbox-coordinator
              exec: /opt/crabbox-coordinator/start.sh
              restart: always
              priority: 20
              enable: true
              scope: system
        plan:
            - run: clone the pinned upstream coordinator source (git from layer-gh)
              command: git clone --depth 1 --branch ${CRABBOX_COORDINATOR_TAG} https://github.com/openclaw/crabbox /opt/crabbox-coordinator
            - run: install the worker's dependencies INCLUDING dev (esbuild needs them at build; NODE_ENV=production from the candy env would otherwise drop them)
              command: npm ci --include=dev --no-audit --no-fund --prefix /opt/crabbox-coordinator/worker
            - run: build the Node runtime (dist-node/server.mjs)
              command: npm run build:node --prefix /opt/crabbox-coordinator/worker
            - run: prune dev dependencies for the slim runtime
              command: npm prune --omit=dev --no-audit --no-fund --prefix /opt/crabbox-coordinator/worker
            - run: write the runtime start wrapper (assembles DATABASE_URL from deploy env)
              write: /opt/crabbox-coordinator/start.sh
              run_as: root
              mode: "0755"
              content: |
                #!/bin/bash
                set -euo pipefail
                POSTGRES_USER=${POSTGRES_USER:-postgres}
                POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
                POSTGRES_HOST=${POSTGRES_HOST:-127.0.0.1}
                POSTGRES_DB=${POSTGRES_DB:-crabbox}
                # Wait (bounded) for PostgreSQL to accept connections — supervisord
                # priority is not a hard ordering guarantee, and the coordinator
                # creates its schemas on startup (pg_isready ships with the
                # postgresql candy).
                for _i in $(seq 1 90); do
                    if pg_isready -h "$POSTGRES_HOST" -p 5432 -U "$POSTGRES_USER" >/dev/null 2>&1; then break; fi
                    sleep 1
                done
                export DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}"
                export CRABBOX_PUBLIC_URL=${CRABBOX_PUBLIC_URL:-http://127.0.0.1:8080}
                exec node /opt/crabbox-coordinator/worker/dist-node/server.mjs
            - check: the built Node coordinator runtime is present at the fixed path
              file:
                file: /opt/crabbox-coordinator/worker/dist-node/server.mjs
                exists: true
            - check: the coordinator start wrapper is installed and executable
              file:
                file: /opt/crabbox-coordinator/start.sh
                filetype: file
                exists: true
            - check: the running coordinator's /v1/health liveness endpoint responds 200 (node runtime container probe)
              context:
                - runtime
              http:
                http: http://127.0.0.1:${HOST_PORT:8080}/v1/health
                status: 200
            - check: the running coordinator's /v1/ready readiness endpoint responds 200
              context:
                - runtime
              http:
                http: http://127.0.0.1:${HOST_PORT:8080}/v1/ready
                status: 200
            - check: the crabbox-coordinator runs as a supervised service
              context:
                - runtime
              service:
                service: crabbox-coordinator
                running: true

crabbox-coordinator-skill:
    skill:
        name: crabbox-coordinator
        family: crabbox
        owner: crabbox-coordinator
        description: |-
            The local Crabbox coordinator (Node.js/PostgreSQL runtime) — supervised
            service on :8080 with /v1/health + /v1/ready, backed by the opencharly
            postgresql candy. The broker for the fully-local Crabbox control plane
            (shared-token auth; GitHub OAuth documented for production).
        content: |-
            # crabbox-coordinator

            ## Candy Properties

            | Property | Value |
            |----------|-------|
            | Service | `crabbox-coordinator` (supervisord, priority 20) |
            | Ports | 8080 (HTTP API + web portal; relayed) |
            | Endpoints | `GET /v1/health`, `GET /v1/ready` |
            | Runtime | Node.js ≥22.12 (layer-nodejs), built from the pinned upstream tag |
            | Backing | opencharly `postgresql` candy (PostgreSQL 13+, pg-boss; schemas auto-created on startup) |
            | Build | clone pinned tag → `npm ci` → `check:node` → `build:node` → `npm prune --omit=dev` (upstream Dockerfile recipe) |

            ## Deploy env (operator / bed)

            | Variable | Meaning |
            |----------|---------|
            | `POSTGRES_USER` / `POSTGRES_PASSWORD` / `POSTGRES_DB` | database credentials (default postgres / crabbox); the start wrapper assembles `DATABASE_URL` |
            | `CRABBOX_SHARED_TOKEN` + `CRABBOX_SHARED_OWNER` | shared-token automation auth (each caller runs `crabbox login --url <origin> --token-stdin`) |
            | `CRABBOX_PUBLIC_URL` | canonical origin (default http://127.0.0.1:8080 for local) |
            | `CRABBOX_ADMIN_TOKEN` / `CRABBOX_GITHUB_*` / budget caps | documented production knobs |

            ## Local deployment

            ```bash
            crabbox login --url http://127.0.0.1:8080 --token-stdin   # from the CLI candy in the same box
            crabbox doctor                                            # coord check passes once ready
            ```

            The coordinator creates the `crabbox` / `crabbox_jobs` schemas on startup.
            Single replica (live bridge sockets are process-local; state is durable in
            PostgreSQL). Cloudflare Workers remains the production alternative — see
            upstream docs.

            ## Verification

            Candy plan checks: the built runtime at the fixed path, the wrapper
            installed, the supervised service running, and live `/v1/health` +
            `/v1/ready` 200s via the `http:` verb. The e2e bed then logs the CLI into
            the broker and drives broker-backed `crabbox:` verb methods
            (leases/usage/events/logs) against it.

            ## Cross-References

            - `/charly-tools:crabbox` — the CLI candy (layer-crabbox).
            - `/charly-check:crabbox` — the `crabbox:` check verb (plugin-crabbox).
            - `/charly-infrastructure:postgresql` — the backing database candy.
            - Upstream [Crabbox](https://github.com/openclaw/crabbox) coordinator docs.