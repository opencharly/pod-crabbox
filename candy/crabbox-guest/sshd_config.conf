# The Crabbox lease SSH contract. Installed as
# /etc/ssh/sshd_config.d/99-crabbox.conf and included by the packaged
# /etc/ssh/sshd_config.
Port 2222
AddressFamily any
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
AuthorizedKeysFile .ssh/authorized_keys
X11Forwarding no
AllowUsers crabbox
Subsystem sftp /usr/lib/ssh/sftp-server
